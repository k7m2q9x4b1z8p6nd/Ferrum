[package]
name = "ferrum"
version = "1.0.0"
edition = "2024"
description = "Ferrum"

[dependencies]
base64 = "0.22.1"
dirs = "7.0.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
ureq = { version = "3.5.2", features = ["json"] }
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Registry"] }
rfd = "0.15.4"
wry = "0.57.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
aes-gcm = "0.10.3"
sha2 = "0.10.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"
