<!doctype html><meta charset=utf-8><meta name=darkreader-lock><meta name=color-scheme content=dark><style>html{background:#131316}</style><title>Downloads</title><link rel=stylesheet href=base.css><link rel=icon href=icons/fav.png>
<style>
.nm{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.nm>div{min-width:0;flex:1}
.nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm img{width:32px;height:32px;flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.hd h1{margin:0}
.ac{display:flex;gap:2px;flex:none}
.row.gone .nm{opacity:.45}
.row.gone small{color:var(--dim)}
.ib.cf{width:auto;padding:0 10px;background:#e5484d;color:#fff;font-size:12px}
</style>
<div class=page><div><div class=hd><h1>Downloads</h1><button class=chip id=clr>Clear downloads</button></div><div class=card id=l></div></div></div>
<script>
const send=o=>ipc.postMessage(JSON.stringify(o)),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fi=n=>`<img src="fileicon/${(n.includes(".")?n.split(".").pop():"file").toLowerCase().replace(/[^a-z0-9]/g,"")||"file"}.png">`;
const sz=b=>b>=1e9?(b/1e9).toFixed(1)+" GB":b>=1e6?(b/1e6).toFixed(1)+" MB":b>=1e3?Math.round(b/1e3)+" KB":b+" B";
const ic=(c,t,d)=>`<button class=ib data-c=${c} title="${t}"><svg viewBox="0 0 16 16"><path d="${d}"/></svg></button>`;
const st=x=>x.gone?"File moved or deleted":x.state=="paused"?"Paused - "+sz(x.recv)+(x.total?" of "+sz(x.total):""):x.state=="done"?"Completed - "+sz(x.size):x.state=="fail"?"Failed":sz(x.recv)+(x.total?" of "+sz(x.total):"")+" - "+sz(x.speed)+"/s",pb=x=>(x.state=="active"||x.state=="paused")&&x.total?`<div class=pb><i style="width:${Math.min(100,x.recv/x.total*100)}%"></i></div>`:"";
let arm=null,last=[];
const ab=x=>x.state=="active"||x.state=="paused"?(x.pause?ic("dl_pause","Pause","M5 3v10M11 3v10"):"")+(x.paused?ic("dl_resume","Resume","M5 3l8 5-8 5z"):"")+ic("dl_cancel","Cancel","M4 4l8 8M12 4l-8 8"):(x.can?ic("dl_open","Open file","M6 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5V10M9 2h5v5M14 2L7.5 8.5")+ic("show_dl","Show in folder","M2 4.5A1.5 1.5 0 0 1 3.5 3H6l1.5 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z")+(arm==x.id?'<button class="ib cf" data-c=dl_delete title="Confirm delete file">Delete?</button>':ic("dl_delete","Delete file","M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.5 8.5h6l.5-8.5M6.5 7v4M9.5 7v4")):"")+ic("dl_remove","Remove from list","M4 4l8 8M12 4l-8 8");
const draw=()=>{l.innerHTML=last.length?last.map(x=>`<div class="row${x.gone?" gone":""}"><div class=nm>${fi(x.name)}<div><b>${esc(x.name)}</b><small>${st(x)}</small>${pb(x)}</div></div><div class=ac data-id=${x.id}>${ab(x)}</div></div>`).join(""):'<div class=row><small>No downloads yet</small></div>'};
window.rbDownloads=d=>{last=d;if(!d.some(x=>x.id==arm))arm=null;draw()};
l.onclick=e=>{const b=e.target.closest("[data-c]");if(!b){const r=e.target.closest(".row:not(.gone)"),a=r&&r.querySelector("[data-id]");if(a&&a.querySelector("[data-c=dl_open]"))send({c:"dl_open",id:+a.dataset.id});return}const id=+b.closest("[data-id]").dataset.id,c=b.dataset.c;if(c=="dl_delete"&&arm!=id){arm=id;return draw()}arm=null;send({c,id})};
l.onmouseleave=()=>{if(arm!=null){arm=null;draw()}};
clr.onclick=()=>send({c:"dl_clear"});
send({c:"downloads_get"});
</script>
