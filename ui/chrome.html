<!doctype html><meta charset=utf-8><meta name=darkreader-lock><meta name=color-scheme content=dark><style>html{background:#131316}</style><link rel=stylesheet href=base.css><link rel=icon href=icons/fav.png>
<style>
body{background:var(--bg)}
#tabs{height:38px;display:flex;align-items:flex-end;padding:0 0 0 8px}
#strip{display:flex;gap:2px;min-width:0;align-items:flex-end;height:100%;padding-top:6px}
.tab{width:200px;min-width:60px;height:32px;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:8px;padding:0 6px 0 11px;color:var(--dim);cursor:default;flex:0 1 200px;min-width:0}
.tab:hover{background:var(--s1)}
.tab.on{background:var(--s2);color:var(--tx)}
.tab img,.tab i,.bi i,.bi img{width:16px;height:16px;border-radius:4px;flex:none}
.tab i,.bi i{background:var(--s3);font:600 10px/16px system-ui;text-align:center;font-style:normal;color:var(--dim)}
.tab span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.priv>span::before{content:"Private · "}.tab.pin{flex:0 0 40px;width:40px;padding:0;justify-content:center}.tab.pin span,.tab.pin .x{display:none}
.tab .x{width:22px;height:22px;border-radius:6px;opacity:0}.tab:hover .x,.tab.on .x{opacity:1}
.tab .x svg{width:12px;height:12px;stroke-width:2.2}
.tab.ld i{animation:p 1s infinite}@keyframes p{50%{opacity:.35}}
#drag{flex:1;height:100%}
#mu{position:relative}#mu.up::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
#wc{display:flex;height:100%}
#wc button{width:46px;height:100%;display:grid;place-items:center;color:var(--dim)}
#wc button:hover{background:var(--s3);color:var(--tx)}#wc button:active{background:var(--bd)}#wc button.cl:hover{background:#e5484d;color:#fff}
#bar{height:42px;background:var(--s2);display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--bd)}
#omni{flex:1;height:32px;margin:0 8px;border-radius:16px;background:var(--bg);border:1px solid transparent;display:flex;align-items:center;transition:border-color .12s}
#omni:focus-within{border-color:var(--ac)}
#eng{height:100%;padding:0 8px 0 11px;display:none;align-items:center;gap:5px;border-radius:16px 0 0 16px;color:var(--dim)}
#omni.e #eng{display:flex}#eng:hover{color:var(--tx);background:var(--s1)}#eng img{width:16px;height:16px;border-radius:50%}
#eng svg{width:10px;height:10px;stroke-width:2.6}
#q{flex:1;height:100%;background:none;border:0;outline:0;color:var(--tx);font:inherit;user-select:text;padding:0 14px}#omni.e #q{padding-left:0}
#q::placeholder{color:var(--dim)}
.sep{width:1px;height:18px;background:var(--bd);margin:0 4px}
#star{width:28px;height:28px;margin-right:2px;border-radius:50%}
#star.on{color:var(--ac)}#star.on svg{fill:currentColor}
#bar:has(+#bm:not([hidden])){border-bottom:0}
#bm{height:34px;background:var(--s2);display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--bd);overflow:hidden}
#bm[hidden]{display:none}
#bm small{color:var(--dim);padding:0 8px}
.bi{height:26px;max-width:180px;padding:0 8px;border-radius:8px;display:flex;align-items:center;gap:6px;flex:none}
.bi:hover{background:var(--s3)}.bi:active{background:var(--bd)}
.bi span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bi svg{color:var(--dim)}
</style>
<div id=tabs>
 <div id=strip></div>
 <button class=ib id=nt title="New tab" style="width:28px;height:28px;margin:0 0 2px 4px"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
 <div id=drag></div>
 <div id=wc><button id=mn><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button><button id=mx><svg viewBox="0 0 16 16"><rect x=3 y=3 width=10 height=10 rx=1.5 /></svg></button><button id=cl class=cl><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9m0-9l-9 9"/></svg></button></div>
</div>
<div id=bar>
 <button class=ib id=bk title=Back><svg viewBox="0 0 16 16"><path d="M13 8H3m4-4L3 8l4 4"/></svg></button>
 <button class=ib id=fw title=Forward><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
 <button class=ib id=rl title=Reload><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/></svg></button>
 <div id=omni><button id=eng title="Search engine"><img id=ei><svg viewBox="0 0 16 16"><path d="M3 6l5 5 5-5"/></svg></button><input id=q spellcheck=false autocomplete=off><button class=ib id=star title="Bookmark this tab"><svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 4 4.3.5-3.2 3 .9 4.3L8 11.4l-3.9 2.2.9-4.3-3.2-3 4.3-.5z"/></svg></button></div>
 <button class=ib id=ex title=Extensions><svg viewBox="0 0 16 16"><path d="M6 3h2a1.5 1.5 0 0 1 3 0h2v3a1.5 1.5 0 0 1 0 3v4H3V9a1.5 1.5 0 0 0 0-3V3z"/></svg></button>
 <button class=ib id=dl title=Downloads><svg viewBox="0 0 16 16"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13h10"/></svg></button>
 <button class=ib id=mu title=Menu><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
</div>
<div id=bm hidden></div>
<script>
const $=id=>document.getElementById(id),send=o=>ipc.postMessage(JSON.stringify(o));
let S={tabs:[],active:0,engine:{name:"",letter:""},bm:{items:[],folders:[]}},sugs=[],hl=-1,typed="",drafts={},last=0,nocomp=false,st=0,bt=0;
const rect=e=>{const r=e.getBoundingClientRect();return{x:Math.round(r.left),y:Math.round(r.bottom),w:Math.round(r.width)}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const FO='<svg viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3H6l1.5 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></svg>';
const shown=(u,full)=>{if(/^http:\/\/rb\.localhost\/(newtab)?$/.test(u))return"";if(S.clean&&!full){const m=u.match(/^http:\/\/rb\.localhost\/([a-z]+)\/?$/);if(m)return m[1][0].toUpperCase()+m[1].slice(1);return u.replace(/^https?:\/\/(www\.)?/,"").replace(/^([^\/?#]*)\/$/,"$1")}return u.replace(/^http:\/\/rb\.localhost\//,"rb://")};
const fav=(h,t)=>{const L=`<i>${esc((t[0]||"·").toUpperCase())}</i>`;return h?`<img src="favicon/${h}.png" onerror="this.outerHTML=this.dataset.l" data-l="${L.replace(/"/g,"&quot;")}">`:L};
const edit=()=>{const a=S.tabs.find(t=>t.id==S.active);$("omni").classList.toggle("e",document.activeElement===$("q")||!!a&&shown(a.url)==="")};
function draw(){
 $("mu").classList.toggle("up",!!S.update);
 $("strip").innerHTML=S.tabs.map(t=>{let h="";try{h=new URL(t.url).host}catch{}
  const L=`<i>${(t.title[0]||"·").toUpperCase()}</i>`,src=/^http:\/\/rb\.localhost\/(newtab)?$/.test(t.url)||h==="rb.localhost"?"icons/fav.png":t.icon,
  ic=src?`<img src="${src}" onerror="this.outerHTML=this.dataset.l" data-l="${L.replace(/"/g,"&quot;")}">`:L;
  return `<div class="tab${t.id==S.active?" on":""}${t.loading?" ld":""}${t.pinned?" pin":""}${t.private?" priv":""}" data-id=${t.id}>${ic}<span>${t.title.replace(/</g,"&lt;")}</span><button class="ib x" data-x=${t.id}><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9m0-9l-9 9"/></svg></button></div>`}).join("");
 const a=S.tabs.find(t=>t.id==S.active);
 for(const k in drafts)if(!S.tabs.some(t=>t.id==k))delete drafts[k];
 if(a){const f=document.activeElement===$("q")&&document.hasFocus(),sw=a.id!=last;last=a.id;if(sw||!(f&&a.id in drafts)){const v=shown(a.url,f);if($("q").value!==v)$("q").value=v;if(f&&sw)$("q").select()}}
 edit();
 $("q").placeholder=`Search with ${S.engine.name} or enter address`;
 $("ei").src=`icons/${S.engine.id}.png`;
 $("bm").hidden=!S.bar;
 $("star").classList.toggle("on",!!S.starred);
 $("bm").innerHTML=S.bm.folders.map(f=>`<button class=bi data-f="${esc(f)}">${FO}<span>${esc(f)}</span></button>`).concat(S.bm.items.filter(b=>b.folder==null).map(b=>`<button class=bi data-b=${b.id}>${fav(b.h,b.title)}<span>${esc(b.title)}</span></button>`)).join("")||"<small>Bookmarks you add appear here</small>";
 $("rl").innerHTML=a&&a.loading?'<svg viewBox="0 0 16 16"><path d="M4 4l8 8m0-8l-8 8"/></svg>':'<svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/></svg>';
}
let owned=0;
window.rb={anchor(){requestAnimationFrame(()=>{const r=$("dl").getBoundingClientRect();send({c:"anchor",x:Math.round(r.right),y:Math.round(r.bottom)})})},seed(v){const i=$("q"),t=i.value.slice(owned);if(document.activeElement!==i)i.focus();owned=v.length;i.value=v+t;i.setSelectionRange(i.value.length,i.value.length);i.dispatchEvent(new Event("input"))},state(s){S=s;draw()},sugs(l,q,c){const i=$("q");if(q!==typed||hl>=0||document.activeElement!==i||!document.hasFocus())return;sugs=l;if(c&&!nocomp&&i.value===q&&i.selectionStart==q.length&&c.toLowerCase().startsWith(q.toLowerCase())){i.value=q+c.slice(q.length);i.setSelectionRange(q.length,c.length)}send({c:"popup",k:"sug",...rect($("omni")),n:l.length,items:l})}};
$("strip").onmousedown=e=>{const x=e.target.closest("[data-x]"),t=e.target.closest("[data-id]");if(e.button==1){e.preventDefault();if(t&&!S.tabs.find(a=>a.id==+t.dataset.id).pinned)send({c:"close",id:+t.dataset.id});return}if(e.button)return;if(x)send({c:"close",id:+x.dataset.x});else if(t)send({c:"select",id:+t.dataset.id})};
$("strip").onauxclick=e=>e.preventDefault();
$("strip").oncontextmenu=e=>{e.preventDefault();const t=e.target.closest("[data-id]");if(t)send({c:"popup",k:"tab",id:+t.dataset.id,x:e.clientX,y:e.clientY,w:0})};
$("bm").onclick=e=>{const b=e.target.closest("[data-b]"),f=e.target.closest("[data-f]");if(b)send({c:"bm_open",id:+b.dataset.b});else if(f)send({c:"popup",k:"bmfolder",f:f.dataset.f,...rect(f),y:Math.round($("bm").getBoundingClientRect().bottom),w:0})};
$("bm").onmousedown=e=>{const b=e.target.closest("[data-b]");if(e.button==1){e.preventDefault();if(b)send({c:"bm_open",id:+b.dataset.b,new:true})}};
$("bm").oncontextmenu=e=>{e.preventDefault();const b=e.target.closest("[data-b]"),f=e.target.closest("[data-f]");send(f?{c:"popup",k:"bmfctx",f:f.dataset.f,x:e.clientX,y:e.clientY,w:0}:b?{c:"popup",k:"bmctx",id:+b.dataset.b,x:e.clientX,y:e.clientY,w:0}:{c:"popup",k:"bmbar",x:e.clientX,y:e.clientY,w:0})};
const star=()=>{const r=$("star").getBoundingClientRect();send({c:"bm_star",x:Math.round(r.right),y:Math.round($("omni").getBoundingClientRect().bottom)+4})};
$("star").onclick=star;
$("drag").onmousedown=e=>{if(e.button==0)send({c:e.detail==2?"max":"drag"})};
$("tabs").ondblclick=e=>{if(e.target===$("tabs"))send({c:"max"})};
for(const[i,c]of[["nt","newtab"],["bk","back"],["fw","fwd"],["rl","reload"],["mn","min"],["mx","max"],["cl","quit"]])$(i).onclick=()=>send({c});
$("eng").onclick=()=>send({c:"popup",k:"eng",...rect($("eng")),x:rect($("omni")).x});
const pop=(k,i)=>$(i).onclick=()=>{const r=$(i).getBoundingClientRect();send({c:"popup",k,x:Math.round(r.right),y:Math.round(r.bottom),w:0})};pop("ext","ex");pop("dl","dl");
$("mu").onclick=()=>{const r=$("mu").getBoundingClientRect();send({c:"popup",k:"menu",x:Math.round(r.right),y:Math.round(r.bottom),w:0})};
const go=v=>{delete drafts[S.active];send({c:"nav",q:v});send({c:"popup_close"});$("q").blur()};
$("q").oninput=e=>{nocomp=/^delete/.test(e.inputType);hl=-1;typed=$("q").value;drafts[S.active]=typed;clearTimeout(st);if(typed.trim())st=setTimeout(()=>send({c:"suggest",q:typed}),40);else{sugs=[];send({c:"popup_close"})}};
let clk=0;$("q").onmousedown=()=>{clk=1};
$("q").onfocus=()=>{send({c:"qf",on:1});if(bt){clearTimeout(bt);bt=0;return}const i=$("q"),keep=!clk&&typed&&i.value.startsWith(typed);clk=0;if(!keep){const a=S.tabs.find(t=>t.id==S.active);if(S.clean&&a&&!(a.id in drafts))i.value=shown(a.url,1);i.select()}edit()};
$("eng").onmousedown=e=>e.preventDefault();
const acc=()=>{const i=$("q");if(i.selectionStart==i.selectionEnd||i.selectionEnd!=i.value.length||i.selectionStart!=typed.length)return false;i.setSelectionRange(i.value.length,i.value.length);typed=i.value;drafts[S.active]=typed;nocomp=true;send({c:"suggest",q:typed});return true};
$("q").onblur=()=>{send({c:"qf",on:0});clearTimeout(bt);bt=setTimeout(()=>{bt=0;if(document.activeElement===$("q"))return;owned=0;drafts={};typed="";sugs=[];draw();send({c:"popup_close",only:"sug"})},120)};
$("q").onkeydown=e=>{
 if(e.key=="Enter")go($("q").value);
 else if(e.key=="Escape"){delete drafts[S.active];$("q").blur();draw()}

 else if((e.key=="Tab"||e.key=="ArrowRight")&&!e.shiftKey&&acc())e.preventDefault();
 else if((e.key=="ArrowDown"||e.key=="ArrowUp")&&sugs.length){e.preventDefault();hl=(hl+(e.key=="ArrowDown"?1:-1)+sugs.length+1)%(sugs.length+1);if(hl==sugs.length)hl=-1;$("q").value=hl<0?typed:sugs[hl].q;send({c:"hl",i:hl})}
};
window.addEventListener("keydown",e=>{if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&document.activeElement!==$("q")&&!/^(INPUT|TEXTAREA|BUTTON)$/.test(document.activeElement.tagName)&&(e.key.length==1||e.key=="Process"))$("q").focus();if(e.ctrlKey&&e.key=="l"){$("q").focus();e.preventDefault()}else if(e.ctrlKey&&e.key=="d"){star();e.preventDefault()}else if(e.ctrlKey&&e.key=="b"){send({c:"bookmarks"});e.preventDefault()}});
document.oncontextmenu=e=>e.preventDefault();
send({c:"ready"});
</script>
